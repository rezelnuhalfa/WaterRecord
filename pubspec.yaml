
name: data_air_warga

description: Aplikasi pendataan meter air warga.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Penyimpanan data lokal
  shared_preferences: ^2.5.3

  # Foto profil warga
  image_picker: ^1.2.1
  path_provider: ^2.1.5

  # Cetak struk PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Fitur senter
  torch_light: ^1.1.0

  flutter_classic_bluetooth: ^1.3.0
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
